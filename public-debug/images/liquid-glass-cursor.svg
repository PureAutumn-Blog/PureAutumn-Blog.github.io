
<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 明亮、通透的冰蓝玻璃 -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="25%" stop-color="#eaf8ff" stop-opacity="0.53"/>
      <stop offset="52%" stop-color="#91ccff" stop-opacity="0.42"/>
      <stop offset="78%" stop-color="#72b7ff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#c9e7ff" stop-opacity="0.62"/>
    </linearGradient>

    <!-- 清透蓝色描边，减少灰暗感 -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#91ccff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#5798eb" stop-opacity="0.64"/>
    </linearGradient>

    <!-- 柔和的白色玻璃反光 -->
    <linearGradient id="shine" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d8efff" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" result="blur"/>
      <feOffset dy="0.35" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆润的玻璃箭头 -->
  <path
    d="M5.1 2.8
       Q4.2 2.3 3.5 2.9
       Q2.9 3.4 2.9 4.5
       L2.9 24.4
       Q2.9 25.8 3.9 26.1
       Q4.8 26.5 5.7 25.6
       L10.1 21.2
       Q10.8 20.5 11.3 21.5
       L15.4 28.4
       Q16.1 29.6 17.3 29.0
       L19.0 28.1
       Q20.1 27.5 19.5 26.4
       L15.6 19.3
       Q15.1 18.4 16.3 18.3
       L24.5 18.0
       Q26.1 17.9 26.4 16.8
       Q26.7 15.9 25.5 15.1
       Z"
    fill="url(#glass)"
    stroke="url(#edge)"
    stroke-width="1.05"
    stroke-linejoin="round"
    filter="url(#shadow)"/>

  <!-- 内侧白色高光 -->
  <path
    d="M5.0 5.0
       L5.0 23.0
       Q5.0 23.7 5.6 23.2
       L9.7 19.2
       Q11.0 18.0 12.0 19.8
       L16.9 27.5"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.95"
    stroke-width="1.05"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- 顶部折射光带 -->
  <path
    d="M5.1 4.5
       Q5.4 3.9 6.2 4.6
       Q13.1 8.4 19.4 13.3
       Q20.4 14.2 22.0 15.0"
    fill="none"
    stroke="url(#shine)"
    stroke-width="1.5"
    stroke-linecap="round"/>

  <!-- 局部亮面 -->
  <path
    d="M6.1 7.0 L6.1 15.5"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.72"
    stroke-width="0.8"
    stroke-linecap="round"/>
</svg>
